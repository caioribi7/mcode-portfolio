<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Estudo de Tipologia 01: Residência unifamiliar com estrutura mista, concreto aparente e balanço estrutural">
  <rect width="760" height="520" fill="#EAE5DA"/>
  <!-- Grid técnico sutil -->
  <g stroke="#D5CFC2" stroke-width="0.75">
    <line x1="0" y1="100" x2="760" y2="100"/>
    <line x1="0" y1="220" x2="760" y2="220"/>
    <line x1="0" y1="380" x2="760" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="520"/>
    <line x1="380" y1="0" x2="380" y2="520"/>
    <line x1="610" y1="0" x2="610" y2="520"/>
  </g>

  <!-- Volume arquitetônico residencial -->
  <!-- Pátio e espelho d'água -->
  <rect x="60" y="380" width="640" height="22" fill="#8C8679" stroke="#181917" stroke-width="1.5"/>
  <rect x="420" y="392" width="240" height="12" fill="#4B5D63" stroke="#181917" stroke-width="1"/>

  <!-- Bloco térreo em pedra/concreto e vidro -->
  <rect x="120" y="250" width="260" height="130" fill="#A39C8E" stroke="#181917" stroke-width="1.5"/>
  <rect x="380" y="250" width="230" height="130" fill="#232827" stroke="#181917" stroke-width="1.5"/>
  <line x1="456" y1="250" x2="456" y2="380" stroke="#EAE5DA" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="533" y1="250" x2="533" y2="380" stroke="#EAE5DA" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Pavimento superior com balanço de 4,20m -->
  <rect x="95" y="120" width="585" height="130" fill="#CFC8B9" stroke="#181917" stroke-width="1.75"/>
  <rect x="90" y="108" width="595" height="12" fill="#181917"/>
  <!-- Painel de brises ripados -->
  <rect x="240" y="136" width="290" height="98" fill="#8E4A2F" stroke="#181917" stroke-width="1.2"/>
  <g stroke="#181917" stroke-width="1.5">
    <line x1="260" y1="136" x2="260" y2="234"/>
    <line x1="280" y1="136" x2="280" y2="234"/>
    <line x1="300" y1="136" x2="300" y2="234"/>
    <line x1="320" y1="136" x2="320" y2="234"/>
    <line x1="340" y1="136" x2="340" y2="234"/>
    <line x1="360" y1="136" x2="360" y2="234"/>
    <line x1="380" y1="136" x2="380" y2="234"/>
    <line x1="400" y1="136" x2="400" y2="234"/>
    <line x1="420" y1="136" x2="420" y2="234"/>
    <line x1="440" y1="136" x2="440" y2="234"/>
    <line x1="460" y1="136" x2="460" y2="234"/>
    <line x1="480" y1="136" x2="480" y2="234"/>
    <line x1="500" y1="136" x2="500" y2="234"/>
  </g>

  <!-- Indicadores técnicos -->
  <g font-family="Consolas, monospace" font-size="11" fill="#181917">
    <line x1="610" y1="76" x2="680" y2="76" stroke="#9E3E22" stroke-width="1.5"/>
    <line x1="610" y1="70" x2="610" y2="82" stroke="#9E3E22" stroke-width="1.5"/>
    <line x1="680" y1="70" x2="680" y2="82" stroke="#9E3E22" stroke-width="1.5"/>
    <text x="645" y="66" text-anchor="middle" fill="#9E3E22">BALANÇO</text>

    <rect x="60" y="432" width="640" height="52" fill="#F4F1EA" stroke="#181917" stroke-width="1.2"/>
    <rect x="60" y="432" width="6" height="52" fill="#9E3E22"/>
    <text x="80" y="454" font-weight="bold">TIPOLOGIA A · RESIDÊNCIA UNIFAMILIAR SOB MEDIDA</text>
    <text x="80" y="472" fill="#4A4943">Foco: Concreto aparente curado, caixilharia minimalista e impermeabilização integral de cobertura.</text>
  </g>
</svg>

