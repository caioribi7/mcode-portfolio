<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Estudo de Tipologia 03: Reforma estrutural e retrofit unindo edificação preexistente em alvenaria a novo pórtico metálico">
  <rect width="760" height="520" fill="#EAE5DA"/>

  <!-- Volume Preexistente (Esquerda — Alvenaria/Concreto Preservado) -->
  <polygon points="110,170 250,115 390,170 390,395 110,395" fill="#CFC8B9" stroke="#181917" stroke-width="1.75"/>
  <!-- Abertura original requalificada com pórtico de reforço em aço corten -->
  <rect x="165" y="255" width="170" height="140" fill="#232827" stroke="#9E3E22" stroke-width="5"/>
  <line x1="250" y1="255" x2="250" y2="395" stroke="#9E3E22" stroke-width="3"/>

  <!-- Volume de Ampliação / Anexo em Estrutura Metálica Leve (Direita) -->
  <rect x="390" y="205" width="260" height="190" fill="#232827" stroke="#181917" stroke-width="1.75"/>
  <!-- Pórticos metálicos destacados em terracota -->
  <g fill="#9E3E22" stroke="#181917" stroke-width="1">
    <rect x="386" y="195" width="272" height="12"/>
    <rect x="386" y="205" width="10" height="190"/>
    <rect x="515" y="205" width="10" height="190"/>
    <rect x="646" y="205" width="10" height="190"/>
  </g>
  <!-- Contraventamento em X técnico -->
  <line x1="525" y1="207" x2="646" y2="395" stroke="#9E3E22" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="646" y1="207" x2="525" y2="395" stroke="#9E3E22" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Base e fundação representada em corte -->
  <rect x="60" y="395" width="640" height="16" fill="#8C8679" stroke="#181917" stroke-width="1.5"/>
  <!-- Sapatas de reforço -->
  <rect x="150" y="411" width="32" height="14" fill="#181917"/>
  <rect x="320" y="411" width="32" height="14" fill="#181917"/>
  <rect x="504" y="411" width="32" height="14" fill="#9E3E22"/>
  <rect x="635" y="411" width="32" height="14" fill="#9E3E22"/>

  <!-- Legendas de intervenção -->
  <g font-family="Consolas, monospace" font-size="10.5" fill="#181917">
    <rect x="152" y="75" width="196" height="22" fill="#F4F1EA" stroke="#181917" stroke-width="1"/>
    <text x="250" y="90" text-anchor="middle">ESTRUTURA PREEXISTENTE</text>

    <rect x="425" y="155" width="196" height="22" fill="#9E3E22"/>
    <text x="523" y="170" text-anchor="middle" fill="#F4F1EA">ANEXO E REFORÇO METÁLICO</text>

    <rect x="60" y="432" width="640" height="52" fill="#F4F1EA" stroke="#181917" stroke-width="1.2"/>
    <rect x="60" y="432" width="6" height="52" fill="#9E3E22"/>
    <text x="80" y="454" font-size="11" font-weight="bold">TIPOLOGIA C · REFORMA ESTRUTURAL, AMPLIAÇÃO E RETROFIT</text>
    <text x="80" y="472" font-size="11" fill="#4A4943">Foco: Escoramento dimensionado, abertura de vãos com vigas metálicas e renovação de prumadas.</text>
  </g>
</svg>

